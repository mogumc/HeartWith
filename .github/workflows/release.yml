name: Release APK

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Compute version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          SHORT_HASH=$(git rev-parse --short=6 HEAD)
          echo "name=v${TAG}-${SHORT_HASH}" >> "$GITHUB_OUTPUT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          echo "code=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        run: |
          ./gradlew assembleDebug assembleRelease \
            -PheartwithClientVersionName="${{ steps.version.outputs.name }}" \
            -PheartwithClientVersionCode="${{ steps.version.outputs.code }}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HeartWith-${{ steps.version.outputs.name }}-debug
          path: build/outputs/apk/debug/heartwith-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HeartWith-${{ steps.version.outputs.name }}-release
          path: build/outputs/apk/release/heartwith-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HeartWith ${{ steps.version.outputs.name }}
          files: |
            build/outputs/apk/debug/heartwith-debug.apk
            build/outputs/apk/release/heartwith-release.apk
          generate_release_notes: true
